services:

  jenkins:
    build:
      context: ./docker/jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    hostname: jenkins

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
    - "990"

    networks:
      - xld-xlr

    restart: unless-stopped


  registry:
    image: registry:3
    container_name: registry
    hostname: registry

    ports:
      - "5000:5000"

    volumes:
      - registry-data:/var/lib/registry

    networks:
      - xld-xlr

    restart: unless-stopped

  xld:
    build:
      context: ./docker/xld
      dockerfile: Dockerfile
    container_name: xld
    hostname: xld

    ports:
      - "4516:4516"

    environment:
      ADMIN_PASSWORD: ${XLD_ADMIN_PASSWORD}
      ACCEPT_EULA: "Y"

    volumes:
      - xld-data:/opt/xebialabs/xl-deploy-server
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
    - "990"

    networks:
      - xld-xlr

    restart: unless-stopped


  xlr:
    build:
      context: ./docker/xlr
      dockerfile: Dockerfile
    container_name: xlr
    hostname: xlr

    ports:
      - "5516:5516"

    environment:
      ADMIN_PASSWORD: ${XLR_ADMIN_PASSWORD}
      ACCEPT_EULA: "Y"

    volumes:
      - xlr-data:/opt/xebialabs/xl-release-server
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
    - "990"

    networks:
      - xld-xlr

    depends_on:
      - xld

    restart: unless-stopped

  release-runner:
    image: xebialabs/release-runner:26.3.0
    container_name: release-runner
    hostname: release-runner

    environment:
      RELEASE_RUNNER_RELEASE_URL: http://xlr:5516
      RELEASE_RUNNER_TOKEN: ${RELEASE_RUNNER_TOKEN}
      RELEASE_RUNNER_PROFILE: docker
      RELEASE_RUNNER_DOCKER_RUN_ON_SAME_NETWORK: "true"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    
    group_add:
    - "990"

    networks:
      - xld-xlr
    
    depends_on:
      - xlr

    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: docker-proxy
    hostname: docker-proxy

    environment:
      AUTH: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - xld-xlr

    restart: unless-stopped

volumes:

  jenkins-data:
    name: jenkins-data

  registry-data:
    name: registry-data

  xld-data:
    name: xld-data

  xlr-data:
    name: xlr-data


networks:

  xld-xlr:
    name: xld-xlr
    driver: bridge
