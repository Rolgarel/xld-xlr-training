services:

  jenkins:
    build:
      context: ./docker/jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    hostname: jenkins

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
    - "990"

    networks:
      - xld-xlr

    restart: unless-stopped


  registry:
    image: registry:3
    container_name: registry
    hostname: registry

    ports:
      - "5000:5000"

    volumes:
      - registry-data:/var/lib/registry

    networks:
      - xld-xlr

    restart: unless-stopped

  xld:
    build:
      context: ./docker/xld
      dockerfile: Dockerfile
    container_name: xld
    hostname: xld

    ports:
      - "4516:4516"

    environment:
      ADMIN_PASSWORD: ${XLD_ADMIN_PASSWORD}
      ACCEPT_EULA: "Y"

    volumes:
      - xld-data:/opt/xebialabs/xl-deploy-server
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
    - "990"

    networks:
      - xld-xlr

    restart: unless-stopped


  xlr:
    build:
      context: ./docker/xlr
      dockerfile: Dockerfile
    container_name: xlr
    hostname: xlr

    ports:
      - "5516:5516"

    environment:
      ADMIN_PASSWORD: ${XLR_ADMIN_PASSWORD}
      ACCEPT_EULA: "Y"

    volumes:
      - xlr-data:/opt/xebialabs/xl-release-server
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
    - "990"

    networks:
      - xld-xlr

    depends_on:
      - xld

    restart: unless-stopped


volumes:

  jenkins-data:
    name: jenkins-data

  registry-data:
    name: registry-data

  xld-data:
    name: xld-data

  xlr-data:
    name: xlr-data


networks:

  xld-xlr:
    name: xld-xlr
    driver: bridge
